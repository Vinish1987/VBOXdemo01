# Starts a Postgres database that matches DATABASE_URL in .env.example.
# Run:  docker compose up -d
# Stop: docker compose down     (add -v to also erase the data)
services:
  db:
    image: postgres:16
    container_name: vbox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vbox
      POSTGRES_PASSWORD: vbox
      POSTGRES_DB: vbox
    ports:
      - "5432:5432"
    volumes:
      - vbox_pgdata:/var/lib/postgresql/data

volumes:
  vbox_pgdata:
